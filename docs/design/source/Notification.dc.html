<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Сповіщення під час очікування</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Onest,'Segoe UI',system-ui,sans-serif;background:#D6D3CB}
button{font-family:inherit;cursor:pointer}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</helmet>
<div style="width: 852px; height: 568px; box-sizing: border-box; padding: 24px; display: flex; gap: 24px; background: #D6D3CB; font-family: Onest, 'Segoe UI', system-ui, sans-serif">
<sc-for list="{{panels}}" as="p" hint-placeholder-count="2">
<div style="width: 390px; height: 520px; flex-shrink: 0; box-sizing: border-box; border-radius: 28px; overflow: hidden; padding: 24px 12px; display: flex; flex-direction: column; gap: 8px; background: {{p.t.shade}}; color: {{p.t.text}}">
<sc-for list="{{p.items}}" as="n" hint-placeholder-count="2">
<article style="background: {{n.t.card}}; border-radius: 24px; padding: 14px 16px 8px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: {{n.t.text2}}">
<span style="width: 24px; height: 24px; border-radius: 12px; background: {{n.t.primary}}; color: {{n.t.onPrimary}}; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 14px; height: 14px; stroke-width: 2.4"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></span>
<span>Відбій · {{n.when}}</span>
</div>
<h2 style="margin: 2px 0 0; font-size: 16px; font-weight: 600; line-height: 1.3">{{n.title}}</h2>
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: {{n.lvText}}">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{n.dot}}; flex-shrink: 0"></span>
{{n.level}}
</div>
<sc-for list="{{n.lines}}" as="l" hint-placeholder-count="2">
<div style="font-size: 14px; line-height: 1.4; color: {{l.c}}">{{l.text}}</div>
</sc-for>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; margin-top: 4px">
<button style="height: 44px; border-radius: 22px; border: none; background: none; color: {{n.t.primary}}; font-size: 14px; font-weight: 600">Через 10 хв</button>
<button aria-label="Сьогодні не дзвони: відкриє екран очікування для підтвердження" style="height: 44px; border-radius: 22px; border: none; background: none; color: {{n.t.primary}}; font-size: 14px; font-weight: 600">Не дзвонити…</button>
</div>
</article>
</sc-for>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":852,"height":568}}'>
class Component extends DCLogic {
  pal() {
    return [
      { id: 'l', bg: '#F7F5F0', s1: '#EFECE5', s2: '#E6E2DA', s3: '#DAD6CC', text: '#1B1C1F', text2: '#50525A', outline: '#D3CFC5', primary: '#35598F', onPrimary: '#FFFFFF', pc: '#D8E3F7', onPc: '#0F2A4E', redC: '#F9DCD7', onRedC: '#7A1C15', red: '#C23A2E', yelC: '#FBEAB0', onYelC: '#4C3900', yel: '#A67C00', shadow: 'rgba(30,30,40,0.18)', shade: '#E1DDD4', card: '#FBFAF7', redText: '#9E2A20', yelText: '#6B5000' },
      { id: 'd', bg: '#101318', s1: '#1A1E25', s2: '#232830', s3: '#2E343E', text: '#E5E3DE', text2: '#AAADB4', outline: '#2C323B', primary: '#A9C6F3', onPrimary: '#0D2A4F', pc: '#284470', onPc: '#D8E3F7', redC: '#571B16', onRedC: '#FFB4A9', red: '#FF8A7E', yelC: '#433500', onYelC: '#F8DE86', yel: '#EFC845', shadow: 'rgba(0,0,0,0.5)', shade: '#07080B', card: '#1D222A', redText: '#FFB4A9', yelText: '#F8DE86' }
    ];
  }
  renderVals() {
    const items = [
      { when: '06:51', title: 'Будильник 06:45 чекає на відбій тривоги', lv: 'red', level: 'Червона тривога · ракетна загроза',
        lines: [['Загроза застосування балістичного озброєння', true], ['Дім · оновлено 06:51 · крайній час 08:00', false]] },
      { when: '03:12', title: 'Разовий режим: чекаю на відбій тривоги', lv: 'yellow', level: 'Жовта тривога · дронова загроза',
        lines: [['Дім · оновлено 03:12', false]] }
    ];
    const panels = this.pal().map((t) => ({
      t,
      items: items.map((n) => ({
        t,
        when: n.when,
        title: n.title,
        level: n.level,
        dot: n.lv === 'red' ? t.red : t.yel,
        lvText: n.lv === 'red' ? t.redText : t.yelText,
        lines: n.lines.map((l) => ({ text: l[0], c: l[1] ? t.text : t.text2 }))
      }))
    }));
    return { panels };
  }
}
</script>
</body>
</html>
