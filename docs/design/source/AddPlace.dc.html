<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Нове місце</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&display=swap">
<style>
body{margin:0;font-family:Onest,'Segoe UI',system-ui,sans-serif;background:#D6D3CB}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
button,input{font-family:inherit}
button{cursor:pointer}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vb-scroll{scrollbar-width:none;overscroll-behavior:contain}.vb-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 852px; height: 1760px; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 24px; background: #D6D3CB; font-family: Onest, 'Segoe UI', system-ui, sans-serif">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="2">
<div style="display: flex; gap: 24px">
<sc-for list="{{row.cols}}" as="v" hint-placeholder-count="2">
<div style="width: 390px; height: 844px; flex-shrink: 0; border-radius: 28px; overflow: hidden; position: relative; display: flex; flex-direction: column; background: {{v.t.bg}}; color: {{v.t.text}}">
<div style="height: 28px; flex-shrink: 0"></div>
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 8px">
<a href="Places.dc.html" aria-label="Назад" style="width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" style="width: 24px; height: 24px"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg></a>
<h1 style="flex-grow: 1; margin: 0; font-size: 22px; font-weight: 500">Нове місце</h1>
<span style="padding-right: 16px; font-size: 14px; color: {{v.t.text2}}">Крок 1 з 2</span>
</header>
<div class="vb-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 14px">
<div style="height: 56px; flex-shrink: 0; border-radius: 28px; background: {{v.t.s1}}; display: flex; align-items: center; gap: 12px; padding: 0 20px">
<svg class="i" viewBox="0 0 24 24" style="width: 22px; height: 22px; flex-shrink: 0; color: {{v.t.text2}}"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
<label for="{{v.qid}}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Пошук регіону</label>
<input id="{{v.qid}}" type="search" placeholder="Область, район або громада" style="flex-grow: 1; min-width: 0; border: none; background: none; outline: none; font-size: 16px; color: {{v.t.text}}">
</div>
<nav aria-label="Рівні вибору" style="flex-shrink: 0; display: flex; flex-wrap: nowrap; align-items: center; gap: 2px">
<button aria-label="Усі області" title="Усі області" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; border: none; background: none; color: {{v.t.primary}}; display: flex; align-items: center; justify-content: center; padding: 0"><svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4zM9 4v13.5M15 6.5V20"></path></svg></button>
<svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: {{v.t.text2}}"><path d="M9 6l6 6-6 6"></path></svg>
<button style="height: 40px; padding: 0 12px; border-radius: 20px; border: none; background: none; color: {{v.t.primary}}; font-size: 14px; font-weight: 600">Київська обл.</button>
<svg class="i" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: {{v.t.text2}}"><path d="M9 6l6 6-6 6"></path></svg>
<span style="height: 40px; padding: 0 12px; border-radius: 20px; background: {{v.t.s2}}; display: flex; align-items: center; font-size: 14px; font-weight: 600">Обухівський р-н</span>
</nav>
<div style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{v.list}}" as="r" hint-placeholder-count="6">
<button aria-pressed="{{r.on}}" style="display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 8px 14px; border: none; border-radius: 18px; background: {{r.bg}}; color: {{r.t.text}}; text-align: left; width: 100%">
<span style="width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid {{r.ring}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{r.dot}}"></span></span>
<span style="flex-grow: 1; font-size: 16px; font-weight: {{r.w}}">{{r.name}}</span>
</button>
</sc-for>
</div>
<div style="background: {{v.t.s1}}; border-radius: 20px; padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start">
<svg class="i" viewBox="0 0 24 24" style="width: 22px; height: 22px; flex-shrink: 0; color: {{v.t.text2}}"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: {{v.t.text2}}">Будильник враховує тривоги в обраній громаді, у її районі та в області. Тривоги в сусідніх громадах і районах не враховуються.</p>
</div>
</div>
<div style="flex-shrink: 0; padding: 12px 16px 20px; border-top: 1px solid {{v.t.outline}}">
<button style="width: 100%; height: 56px; border-radius: 28px; border: none; background: {{v.t.primary}}; color: {{v.t.onPrimary}}; font-size: 16px; font-weight: 600">Далі</button>
</div>
<sc-if value="{{v.naming}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 20; background: {{v.scrim}}; display: flex; align-items: center; justify-content: center; padding: 24px">
<div role="dialog" aria-modal="true" aria-labelledby="{{v.titleId}}" style="width: 100%; max-width: 328px; box-sizing: border-box; background: {{v.t.s2}}; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; color: {{v.t.text2}}">Крок 2 з 2</span>
<h2 id="{{v.titleId}}" style="margin: 0; font-size: 22px; font-weight: 500">Назвіть місце</h2>
<span style="font-size: 14px; line-height: 1.4; color: {{v.t.text2}}">Кагарлицька громада · Обухівський р-н · Київська обл.</span>
</div>
<div style="position: relative">
<label for="{{v.inputId}}" style="position: absolute; top: -10px; left: 12px; padding: 0 4px; background: {{v.t.s2}}; font-size: 14px; line-height: 1.2; font-weight: 500; color: {{v.t.primary}}">Назва</label>
<input id="{{v.inputId}}" type="text" maxlength="24" value="{{v.draft}}" onChange="{{v.onDraft}}" style="width: 100%; box-sizing: border-box; height: 56px; padding: 0 16px; border-radius: 8px; border: 2px solid {{v.t.primary}}; background: transparent; color: {{v.t.text}}; font-size: 16px; outline: none">
<div style="margin-top: 6px; padding: 0 16px; font-size: 14px; color: {{v.t.text2}}">Наприклад: Дім, Дача, Робота</div>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: none; background: none; color: {{v.t.primary}}; font-size: 16px; font-weight: 600">Назад</button>
<a href="Places.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; display: flex; align-items: center; color: {{v.t.primary}}; font-size: 16px; font-weight: 600">Зберегти</a>
</div>
</div>
</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":852,"height":1760}}'>
class Component extends DCLogic {
  pal() {
    return [
      { id: 'l', bg: '#F7F5F0', s1: '#EFECE5', s2: '#E6E2DA', s3: '#DAD6CC', text: '#1B1C1F', text2: '#50525A', outline: '#D3CFC5', primary: '#35598F', onPrimary: '#FFFFFF', pc: '#D8E3F7', onPc: '#0F2A4E', shadow: 'rgba(30,30,40,0.18)' },
      { id: 'd', bg: '#101318', s1: '#1A1E25', s2: '#232830', s3: '#2E343E', text: '#E5E3DE', text2: '#AAADB4', outline: '#2C323B', primary: '#A9C6F3', onPrimary: '#0D2A4F', pc: '#284470', onPc: '#D8E3F7', shadow: 'rgba(0,0,0,0.5)' }
    ];
  }
  renderVals() {
    const draft = this.state.draft ?? 'Бабуся';
    const items = [
      { id: 'raion', name: 'Увесь Обухівський район', whole: true },
      { id: 'g1', name: 'Васильківська громада' },
      { id: 'g2', name: 'Кагарлицька громада' },
      { id: 'g3', name: 'Козинська громада' },
      { id: 'g4', name: 'Обухівська громада' },
      { id: 'g5', name: 'Українська громада' }
    ];
    const sel = 'g2';
    const rows = this.pal().map((t) => ({
      cols: [false, true].map((naming) => ({
        t, naming,
        qid: 'ap-q-' + t.id + (naming ? '2' : '1'),
        titleId: 'ap-title-' + t.id + (naming ? '2' : '1'),
        inputId: 'ap-in-' + t.id + (naming ? '2' : '1'),
        scrim: t.id === 'l' ? 'rgba(20,20,24,0.4)' : 'rgba(0,0,0,0.6)',
        draft,
        onDraft: (e) => this.setState({ draft: e.target.value }),
        list: items.map((r) => {
          const on = r.id === sel;
          return {
            t, on, name: r.name,
            bg: on ? t.pc : 'transparent',
            ring: on ? t.primary : t.text2,
            dot: on ? t.primary : 'transparent',
            w: r.whole ? '600' : '400'
          };
        })
      }))
    }));
    return { rows };
  }
}
</script>
</body>
</html>
